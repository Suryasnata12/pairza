services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pairza_dev_password}
      POSTGRES_DB: pairza
    ports:
      - "5432:5432"
    volumes:
      - pairza_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Loads the repo-root .env directly into the container, on top of the
    # `environment:` values below — this is how seed-script credentials
    # (DEMO_USER_EMAIL, ADMIN_USER_PASSWORD, etc.) reach the container
    # without ever needing to appear as literal text in this committed
    # file. Deliberately points at the root .env, not apps/api/.env: the
    # root file sits outside the api service's build context entirely, so
    # it's structurally impossible for it to ever get copied into the
    # image by the Dockerfile's `COPY . .` step, even by mistake. If a key
    # below (like DATABASE_URL) is also set in that file, `environment:`
    # wins — Compose always prefers it over env_file.
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-pairza_dev_password}@postgres:5432/pairza
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: '["http://localhost:3000"]'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        # Both of these are read inside next.config.mjs's rewrites()
        # function — and Next.js evaluates that function ONCE, at build
        # time, to produce a fixed routing manifest. It does NOT re-read
        # environment variables on each request the way a typical Node.js
        # server would. That means both values have to be build args, not
        # runtime environment variables — a runtime-only value here would
        # silently have zero effect, since the routing decision was already
        # permanently baked into the image before the container ever starts.
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
        NEXT_PUBLIC_API_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pairza_postgres_data:
